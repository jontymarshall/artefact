name: Publish

# - Publishing a GitHub release uploads to PyPI.
# - Running the workflow by hand ("Run workflow") uploads to TestPyPI.
#
# Uses PyPI trusted publishing (OIDC), so no API tokens are stored. One-off setup:
#   1. On pypi.org (and test.pypi.org) add a "pending publisher" for this repository,
#      workflow `publish.yml`, environment `pypi` (and `testpypi`).
#   2. Create the `pypi` and `testpypi` environments in the repository settings
#      (add required reviewers to `pypi` if you want a manual approval gate).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine

      - name: Release tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(python - <<'PY'
          import re
          text = open("src/artefact/__init__.py", encoding="utf-8").read()
          print(re.search(r'__version__\s*=\s*"([^"]+)"', text).group(1))
          PY
          )
          echo "package version: $version, release tag: $GITHUB_REF_NAME"
          test "v$version" = "$GITHUB_REF_NAME" -o "$version" = "$GITHUB_REF_NAME"

      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
