[build-system]
# setuptools >= 77 is needed for the SPDX `license` string (PEP 639).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "artefact"
dynamic = ["version"]
description = "A 1D radiative transfer model for optically thin dust discs around stars"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
authors = [{ name = "Jonathan P. Marshall" }, 
           { name = "Robin Young" }, 
           { name = "Shane Hengst"}
]
maintainers = [{ name = "Jonathan P. Marshall"}
]
keywords = [
    "astrophysics",
    "debris disc",
    "radiative transfer",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "numba>=0.60",
    "astropy>=6.1",
    "miepython>=2.0",
    "lmfit>=1.3.4",
    "pyyaml",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
dev = ["artefact[test]", "ruff>=0.6"]
examples = ["corner", "emcee", "jupyter", "matplotlib"]

[project.urls]
Homepage = "https://github.com/jontymarshall/artefact"
Issues = "https://github.com/jontymarshall/artefact/issues"
Paper = "https://doi.org/10.1093/mnras/stad913"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
artefact = ["data/**/*", "py.typed"]

[tool.setuptools.dynamic]
version = { attr = "artefact.__version__" }


# ---------------------------------------------------------------------------
# Tests: `pip install -e ".[test]"` then `pytest`
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "error::SyntaxWarning:artefact",  # e.g. invalid escape sequences, `is` with a literal
    "error::DeprecationWarning:artefact",  # e.g. deprecated NumPy functions
]

# ---------------------------------------------------------------------------
# Style: `ruff format` and `ruff check`
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "UP",      # pyupgrade
    "B",       # bugbear
]
ignore = [
    "N803",  # argument names such as `T` (temperature) are conventional in physics code
    "N806",  # likewise for local variables
]
